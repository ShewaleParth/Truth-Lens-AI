name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run complete backend test suite
        run: python -m pytest backend/tests/ -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: TypeScript and production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Build production container
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=
          --build-arg VITE_SUPABASE_URL=https://ci-placeholder.supabase.co
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --tag trustlens-ai:ci .

      - name: Start container and check health endpoint
        shell: bash
        run: |
          cleanup() { docker rm --force trustlens-ai-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach --name trustlens-ai-ci \
            --publish 127.0.0.1:18000:8000 \
            --env ENVIRONMENT=production \
            --env DEBUG=false \
            --env HOST=0.0.0.0 \
            --env PORT=8000 \
            --env SUPABASE_URL=https://ci-placeholder.supabase.co \
            --env SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            --env CORS_ORIGINS=https://ci.example.test \
            --env SEARCH_PROVIDER_ORDER=none \
            trustlens-ai:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/tmp/truthlens-health.json; then
              cat /tmp/truthlens-health.json
              exit 0
            fi
            sleep 2
          done

          docker logs trustlens-ai-ci
          exit 1
